openapi: 3.0.3
info:
  version: 1.1.4
  title: GitHub v3 REST API
  description: GitHub's v3 REST API.
  license:
    name: MIT
    url: https://spdx.org/licenses/MIT
  termsOfService: https://docs.github.com/articles/github-terms-of-service
  contact:
    name: Support
    url: https://support.github.com/contact?tags=dotcom-rest-api
  x-github-plan: api.github.com
servers:
- url: https://api.github.com
security:
- bearerAuth: []
paths:
  /orgs/{org}/teams:
    get:
      summary: List teams
      description: Lists all teams in an organization.
      tags:
      - teams
      operationId: teams/list
      parameters:
      - $ref: '#/components/parameters/org'
      - $ref: '#/components/parameters/per-page'
      - $ref: '#/components/parameters/page'
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
        '404':
          $ref: '#/components/responses/not_found'
      x-github:
        githubCloudOnly: false
        enabledForGitHubApps: true
        category: teams
        subcategory: teams
  /orgs/{org}/teams/{team_slug}/members:
    get:
      summary: List team members
      description: Lists the members of a team.
      tags:
      - teams
      operationId: teams/list-members
      parameters:
      - $ref: '#/components/parameters/org'
      - $ref: '#/components/parameters/team-slug'
      - name: role
        description: Filter members by role in the team.
        in: query
        required: false
        schema:
          type: string
          enum:
          - all
          - member
          - maintainer
      - $ref: '#/components/parameters/per-page'
      - $ref: '#/components/parameters/page'
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
        '404':
          $ref: '#/components/responses/not_found'
      x-github:
        githubCloudOnly: false
        enabledForGitHubApps: true
        category: teams
        subcategory: members
  /orgs/{org}/teams/{team_slug}/repos:
    get:
      summary: List team repositories
      description: Lists the repositories that a team has explicit access to.
      tags:
      - teams
      operationId: teams/list-repos
      parameters:
      - $ref: '#/components/parameters/org'
      - $ref: '#/components/parameters/team-slug'
      - $ref: '#/components/parameters/per-page'
      - $ref: '#/components/parameters/page'
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
        '404':
          $ref: '#/components/responses/not_found'
      x-github:
        githubCloudOnly: false
        enabledForGitHubApps: true
        category: teams
        subcategory: repos
  /repos/{owner}/{repo}:
    get:
      summary: Get a repository
      description: 'The `parent` and `source` objects are present when the repository is a fork. `parent` is the repository
        this repository was forked from, `source` is the ultimate source for the network.


        > [!NOTE]

        > - In order to see the `security_and_analysis` block for a repository you must have admin permissions for the repository
        or be an owner or security manager for the organization that owns the repository. For more information, see "[Managing
        security managers in your organization](https://docs.github.com/organizations/managing-peoples-access-to-your-organization-with-roles/managing-security-managers-in-your-organization)."

        > - To view merge-related settings, you must have the `contents:read` and `contents:write` permissions.'
      tags:
      - repos
      operationId: repos/get
      externalDocs:
        description: API method documentation
        url: https://docs.github.com/rest/repos/repos#get-a-repository
      parameters:
      - $ref: '#/components/parameters/owner'
      - $ref: '#/components/parameters/repo'
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/full-repository'
              examples:
                default-response:
                  $ref: '#/components/examples/full-repository-default-response'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '301':
          $ref: '#/components/responses/moved_permanently'
      x-github:
        githubCloudOnly: false
        enabledForGitHubApps: true
        category: repos
        subcategory: repos
  /repos/{owner}/{repo}/branches:
    get:
      summary: List branches
      description: ''
      tags:
      - repos
      operationId: repos/list-branches
      externalDocs:
        description: API method documentation
        url: https://docs.github.com/rest/branches/branches#list-branches
      parameters:
      - $ref: '#/components/parameters/owner'
      - $ref: '#/components/parameters/repo'
      - name: protected
        description: Setting to `true` returns only branches protected by branch protections or rulesets. When set to `false`,
          only unprotected branches are returned. Omitting this parameter returns all branches.
        in: query
        required: false
        schema:
          type: boolean
      - $ref: '#/components/parameters/per-page'
      - $ref: '#/components/parameters/page'
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/short-branch'
              examples:
                default:
                  $ref: '#/components/examples/short-branch-with-protection-items'
          headers:
            Link:
              $ref: '#/components/headers/link'
        '404':
          $ref: '#/components/responses/not_found'
      x-github:
        githubCloudOnly: false
        enabledForGitHubApps: true
        category: branches
        subcategory: branches
  /repos/{owner}/{repo}/branches/{branch}:
    get:
      summary: Get a branch
      description: ''
      tags:
      - repos
      operationId: repos/get-branch
      externalDocs:
        description: API method documentation
        url: https://docs.github.com/rest/branches/branches#get-a-branch
      parameters:
      - $ref: '#/components/parameters/owner'
      - $ref: '#/components/parameters/repo'
      - $ref: '#/components/parameters/branch'
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/branch-with-protection'
              examples:
                default:
                  $ref: '#/components/examples/branch-get'
        '301':
          $ref: '#/components/responses/moved_permanently'
        '404':
          $ref: '#/components/responses/not_found'
      x-github:
        githubCloudOnly: false
        enabledForGitHubApps: true
        category: branches
        subcategory: branches
  /repos/{owner}/{repo}/collaborators/{username}/permission:
    get:
      summary: Get repository permissions for a user
      description: 'Checks the repository permission and role of a collaborator.


        The `permission` attribute provides the legacy base roles of `admin`, `write`, `read`, and `none`, where the

        `maintain` role is mapped to `write` and the `triage` role is mapped to `read`.

        The `role_name` attribute provides the name of the assigned role, including custom roles. The

        `permission` can also be used to determine which base level of access the collaborator has to the repository.


        The calculated permissions are the highest role assigned to the collaborator after considering all sources of grants,
        including: repo, teams, organization, and enterprise.

        There is presently not a way to differentiate between an organization level grant and a repository level grant from
        this endpoint response.'
      tags:
      - repos
      operationId: repos/get-collaborator-permission-level
      externalDocs:
        description: API method documentation
        url: https://docs.github.com/rest/collaborators/collaborators#get-repository-permissions-for-a-user
      parameters:
      - $ref: '#/components/parameters/owner'
      - $ref: '#/components/parameters/repo'
      - $ref: '#/components/parameters/username'
      responses:
        '200':
          description: if user has admin permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/repository-collaborator-permission'
              examples:
                response-if-user-has-admin-permissions:
                  $ref: '#/components/examples/repository-collaborator-permission-response-if-user-has-admin-permissions'
        '404':
          $ref: '#/components/responses/not_found'
      x-github:
        githubCloudOnly: false
        enabledForGitHubApps: true
        category: collaborators
        subcategory: collaborators
  /repos/{owner}/{repo}/commits:
    get:
      summary: List commits
      description: '**Signature verification object**


        The response will include a `verification` object that describes the result of verifying the commit''s signature.
        The following fields are included in the `verification` object:


        | Name | Type | Description |

        | ---- | ---- | ----------- |

        | `verified` | `boolean` | Indicates whether GitHub considers the signature in this commit to be verified. |

        | `reason` | `string` | The reason for verified value. Possible values and their meanings are enumerated in table
        below. |

        | `signature` | `string` | The signature that was extracted from the commit. |

        | `payload` | `string` | The value that was signed. |

        | `verified_at` | `string` | The date the signature was verified by GitHub. |


        These are the possible values for `reason` in the `verification` object:


        | Value | Description |

        | ----- | ----------- |

        | `expired_key` | The key that made the signature is expired. |

        | `not_signing_key` | The "signing" flag is not among the usage flags in the GPG key that made the signature. |

        | `gpgverify_error` | There was an error communicating with the signature verification service. |

        | `gpgverify_unavailable` | The signature verification service is currently unavailable. |

        | `unsigned` | The object does not include a signature. |

        | `unknown_signature_type` | A non-PGP signature was found in the commit. |

        | `no_user` | No user was associated with the `committer` email address in the commit. |

        | `unverified_email` | The `committer` email address in the commit was associated with a user, but the email address
        is not verified on their account. |

        | `bad_email` | The `committer` email address in the commit is not included in the identities of the PGP key that
        made the signature. |

        | `unknown_key` | The key that made the signature has not been registered with any user''s account. |

        | `malformed_signature` | There was an error parsing the signature. |

        | `invalid` | The signature could not be cryptographically verified using the key whose key-id was found in the signature.
        |

        | `valid` | None of the above errors applied, so the signature is considered to be verified. |'
      tags:
      - repos
      operationId: repos/list-commits
      externalDocs:
        description: API method documentation
        url: https://docs.github.com/rest/commits/commits#list-commits
      parameters:
      - $ref: '#/components/parameters/owner'
      - $ref: '#/components/parameters/repo'
      - name: sha
        description: 'SHA or branch to start listing commits from. Default: the repository’s default branch (usually `main`).'
        in: query
        required: false
        schema:
          type: string
      - name: path
        description: Only commits containing this file path will be returned.
        in: query
        required: false
        schema:
          type: string
      - name: author
        description: GitHub username or email address to use to filter by commit author.
        in: query
        required: false
        schema:
          type: string
      - name: committer
        description: GitHub username or email address to use to filter by commit committer.
        in: query
        required: false
        schema:
          type: string
      - name: since
        description: 'Only show results that were last updated after the given time. This is a timestamp in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601)
          format: `YYYY-MM-DDTHH:MM:SSZ`. Due to limitations of Git, timestamps must be between 1970-01-01 and 2099-12-31
          (inclusive) or unexpected results may be returned.'
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: until
        description: 'Only commits before this date will be returned. This is a timestamp in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601)
          format: `YYYY-MM-DDTHH:MM:SSZ`. Due to limitations of Git, timestamps must be between 1970-01-01 and 2099-12-31
          (inclusive) or unexpected results may be returned.'
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - $ref: '#/components/parameters/per-page'
      - $ref: '#/components/parameters/page'
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/commit'
              examples:
                default:
                  $ref: '#/components/examples/commit-items'
          headers:
            Link:
              $ref: '#/components/headers/link'
        '500':
          $ref: '#/components/responses/internal_error'
        '400':
          $ref: '#/components/responses/bad_request'
        '404':
          $ref: '#/components/responses/not_found'
        '409':
          $ref: '#/components/responses/conflict'
      x-github:
        githubCloudOnly: false
        enabledForGitHubApps: true
        category: commits
        subcategory: commits
  /repos/{owner}/{repo}/contents/{path}:
    get:
      summary: Get repository content
      description: "Gets the contents of a file or directory in a repository. Specify the file path or directory with the\
        \ `path` parameter. If you omit the `path` parameter, you will receive the contents of the repository's root directory.\n\
        \nThis endpoint supports the following custom media types. For more information, see \"[Media types](https://docs.github.com/rest/using-the-rest-api/getting-started-with-the-rest-api#media-types).\"\
        \n\n- **`application/vnd.github.raw+json`**: Returns the raw file contents for files and symlinks.\n- **`application/vnd.github.html+json`**:\
        \ Returns the file contents in HTML. Markup languages are rendered to HTML using GitHub's open-source [Markup library](https://github.com/github/markup).\n\
        - **`application/vnd.github.object+json`**: Returns the contents in a consistent object format regardless of the content\
        \ type. For example, instead of an array of objects for a directory, the response will be an object with an `entries`\
        \ attribute containing the array of objects.\n\nIf the content is a directory, the response will be an array of objects,\
        \ one object for each item in the directory. When listing the contents of a directory, submodules have their \"type\"\
        \ specified as \"file\". Logically, the value _should_ be \"submodule\". This behavior exists [for backwards compatibility\
        \ purposes](https://git.io/v1YCW). In the next major version of the API, the type will be returned as \"submodule\"\
        .\n\nIf the content is a symlink and the symlink's target is a normal file in the repository, then the API responds\
        \ with the content of the file. Otherwise, the API responds with an object describing the symlink itself.\n\nIf the\
        \ content is a submodule, the `submodule_git_url` field identifies the location of the submodule repository, and the\
        \ `sha` identifies a specific commit within the submodule repository. Git uses the given URL when cloning the submodule\
        \ repository, and checks out the submodule at that specific commit. If the submodule repository is not hosted on github.com,\
        \ the Git URLs (`git_url` and `_links[\"git\"]`) and the github.com URLs (`html_url` and `_links[\"html\"]`) will\
        \ have null values.\n\n**Notes**:\n\n- To get a repository's contents recursively, you can [recursively get the tree](https://docs.github.com/rest/git/trees#get-a-tree).\n\
        - This API has an upper limit of 1,000 files for a directory. If you need to retrieve\nmore files, use the [Git Trees\
        \ API](https://docs.github.com/rest/git/trees#get-a-tree).\n- Download URLs expire and are meant to be used just once.\
        \ To ensure the download URL does not expire, please use the contents API to obtain a fresh download URL for each\
        \ download.\n- If the requested file's size is:\n  - 1 MB or smaller: All features of this endpoint are supported.\n\
        \  - Between 1-100 MB: Only the `raw` or `object` custom media types are supported. Both will work as normal, except\
        \ that when using the `object` media type, the `content` field will be an empty\nstring and the `encoding` field will\
        \ be `\"none\"`. To get the contents of these larger files, use the `raw` media type.\n  - Greater than 100 MB: This\
        \ endpoint is not supported."
      tags:
      - repos
      operationId: repos/get-content
      externalDocs:
        description: API method documentation
        url: https://docs.github.com/rest/repos/contents#get-repository-content
      parameters:
      - $ref: '#/components/parameters/owner'
      - $ref: '#/components/parameters/repo'
      - name: path
        description: path parameter
        in: path
        required: true
        schema:
          type: string
        x-multi-segment: true
      - name: ref
        description: 'The name of the commit/branch/tag. Default: the repository’s default branch.'
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/content-file'
              examples:
                response-if-content-is-a-file:
                  $ref: '#/components/examples/content-file-response-if-content-is-a-file'
                response-if-content-is-a-directory:
                  $ref: '#/components/examples/content-file-response-if-content-is-a-directory'
                response-if-content-is-a-symlink:
                  $ref: '#/components/examples/content-file-response-if-content-is-a-symlink'
                response-if-content-is-a-submodule:
                  $ref: '#/components/examples/content-file-response-if-content-is-a-submodule'
        '404':
          $ref: '#/components/responses/not_found'
        '403':
          $ref: '#/components/responses/forbidden'
        '302':
          $ref: '#/components/responses/found'
        '304':
          $ref: '#/components/responses/not_modified'
      x-github:
        githubCloudOnly: false
        enabledForGitHubApps: true
        category: repos
        subcategory: contents
      x-github-breaking-changes:
      - changeset: return_submodule_type_for_submodules_in_directory_lists
        patch:
          description: "Gets the contents of a file or directory in a repository. Specify the file path or directory with\
            \ the `path` parameter. If you omit the `path` parameter, you will receive the contents of the repository's root\
            \ directory.\n\nThis endpoint supports the following custom media types. For more information, see \"[Media types](https://docs.github.com/rest/using-the-rest-api/getting-started-with-the-rest-api#media-types).\"\
            \n\n- **`application/vnd.github.raw+json`**: Returns the raw file contents for files and symlinks.\n- **`application/vnd.github.html+json`**:\
            \ Returns the file contents in HTML. Markup languages are rendered to HTML using GitHub's open-source [Markup\
            \ library](https://github.com/github/markup).\n- **`application/vnd.github.object+json`**: Returns the contents\
            \ in a consistent object format regardless of the content type. For example, instead of an array of objects for\
            \ a directory, the response will be an object with an `entries` attribute containing the array of objects.\n\n\
            If the content is a directory: The response will be an array of objects, one object for each item in the directory.\n\
            \nIf the content is a symlink and the symlink's target is a normal file in the repository, then the API responds\
            \ with the content of the file. Otherwise, the API responds with an object describing the symlink itself.\n\n\
            If the content is a submodule, the `submodule_git_url` field identifies the location of the submodule repository,\
            \ and the `sha` identifies a specific commit within the submodule repository. Git uses the given URL when cloning\
            \ the submodule repository, and checks out the submodule at that specific commit. If the submodule repository\
            \ is not hosted on github.com, the Git URLs (`git_url` and `_links[\"git\"]`) and the github.com URLs (`html_url`\
            \ and `_links[\"html\"]`) will have null values.\n\n**Notes**:\n\n- To get a repository's contents recursively,\
            \ you can [recursively get the tree](https://docs.github.com/rest/git/trees#get-a-tree).\n- This API has an upper\
            \ limit of 1,000 files for a directory. If you need to retrieve\nmore files, use the [Git Trees API](https://docs.github.com/rest/git/trees#get-a-tree).\n\
            - Download URLs expire and are meant to be used just once. To ensure the download URL does not expire, please\
            \ use the contents API to obtain a fresh download URL for each download.\n- If the requested file's size is:\n\
            \  - 1 MB or smaller: All features of this endpoint are supported.\n  - Between 1-100 MB: Only the `raw` or `object`\
            \ custom media types are supported. Both will work as normal, except that when using the `object` media type,\
            \ the `content` field will be an empty\nstring and the `encoding` field will be `\"none\"`. To get the contents\
            \ of these larger files, use the `raw` media type.\n  - Greater than 100 MB: This endpoint is not supported."
        version: '2026-03-10'
    put:
      summary: Create or update file contents
      description: 'Creates a new file or replaces an existing file in a repository.


        > [!NOTE]

        > If you use this endpoint and the "[Delete a file](https://docs.github.com/rest/repos/contents/#delete-a-file)" endpoint
        in parallel, the concurrent requests will conflict and you will receive errors. You must use these endpoints serially
        instead.


        OAuth app tokens and personal access tokens (classic) need the `repo` scope to use this endpoint. The `workflow` scope
        is also required in order to modify files in the `.github/workflows` directory.'
      tags:
      - repos
      operationId: repos/create-or-update-file-contents
      externalDocs:
        description: API method documentation
        url: https://docs.github.com/rest/repos/contents#create-or-update-file-contents
      parameters:
      - $ref: '#/components/parameters/owner'
      - $ref: '#/components/parameters/repo'
      - name: path
        description: path parameter
        in: path
        required: true
        schema:
          type: string
        x-multi-segment: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  description: The commit message.
                content:
                  type: string
                  description: The new file content, using Base64 encoding.
                sha:
                  type: string
                  description: '**Required if you are updating a file**. The blob SHA of the file being replaced.'
                branch:
                  type: string
                  description: 'The branch name. Default: the repository’s default branch.'
                committer:
                  type: object
                  description: 'The person that committed the file. Default: the authenticated user.'
                  properties:
                    name:
                      type: string
                      description: The name of the author or committer of the commit. You'll receive a `422` status code if
                        `name` is omitted.
                    email:
                      type: string
                      description: The email of the author or committer of the commit. You'll receive a `422` status code
                        if `email` is omitted.
                    date:
                      type: string
                      example: '"2013-01-05T13:13:22+05:00"'
                  required:
                  - name
                  - email
                author:
                  type: object
                  description: 'The author of the file. Default: The `committer` or the authenticated user if you omit `committer`.'
                  properties:
                    name:
                      type: string
                      description: The name of the author or committer of the commit. You'll receive a `422` status code if
                        `name` is omitted.
                    email:
                      type: string
                      description: The email of the author or committer of the commit. You'll receive a `422` status code
                        if `email` is omitted.
                    date:
                      type: string
                      example: '"2013-01-15T17:13:22+05:00"'
                  required:
                  - name
                  - email
              required:
              - message
              - content
            examples:
              example-for-creating-a-file:
                summary: Example for creating a file
                value:
                  message: my commit message
                  committer:
                    name: Monalisa Octocat
                    email: octocat@github.com
                  content: bXkgbmV3IGZpbGUgY29udGVudHM=
              example-for-updating-a-file:
                summary: Example for updating a file
                value:
                  message: a new commit message
                  committer:
                    name: Monalisa Octocat
                    email: octocat@github.com
                  content: bXkgdXBkYXRlZCBmaWxlIGNvbnRlbnRz
                  sha: 95b966ae1c166bd92f8ae7d1c313e738c731dfc3
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/file-commit'
              examples:
                example-for-updating-a-file:
                  $ref: '#/components/examples/file-commit-example-for-updating-a-file'
        '201':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/file-commit'
              examples:
                example-for-creating-a-file:
                  $ref: '#/components/examples/file-commit-example-for-creating-a-file'
        '404':
          $ref: '#/components/responses/not_found'
        '422':
          $ref: '#/components/responses/validation_failed'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/basic-error'
                - $ref: '#/components/schemas/repository-rule-violation-error'
      x-github:
        githubCloudOnly: false
        enabledForGitHubApps: true
        category: repos
        subcategory: contents
  /repos/{owner}/{repo}/git/refs:
    post:
      summary: Create a reference
      description: Creates a reference for your repository. You are unable to create new references for empty repositories,
        even if the commit SHA-1 hash used exists. Empty repositories are repositories without branches.
      tags:
      - git
      operationId: git/create-ref
      externalDocs:
        description: API method documentation
        url: https://docs.github.com/rest/git/refs#create-a-reference
      parameters:
      - $ref: '#/components/parameters/owner'
      - $ref: '#/components/parameters/repo'
